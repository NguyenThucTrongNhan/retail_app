version: '3.8'

# LOCAL DEV: PostgreSQL runs locally (not in Docker).
# Run backend/scripts/local_db_setup.sql manually to create the database.
# See docs/manual/dev_setup.md — PostgreSQL section for install instructions.
#
# This file is kept for production / staging deployment of the API container only.

services:
  backend-api:
    build:
      context: ./
      dockerfile: Dockerfile
    container_name: retail_api
    restart: always
    ports:
      - "8080:8080"
    environment:
      NODE_ENV: production
      PORT: 8080
      # Points to the host machine's local PostgreSQL instance
      DATABASE_URL: postgres://shop_admin:LocalShopSecretPassword123!@host.docker.internal:5432/retail_store
    volumes:
      - ./uploads:/app/uploads   # persistent product image storage (C4)

