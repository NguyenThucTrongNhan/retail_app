events {
    worker_connections 1024;
}

http {
    server {
        listen 80;

        client_max_body_size 20M;

        # Auth service — login / refresh / logout / me
        location /api/v1/auth/ {
            proxy_pass       http://auth_service:8082;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Main backend — sync pull / push
        location /api/v1/sync/ {
            proxy_pass       http://backend:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Vision service — runs locally on the host (not in Docker for dev)
        location /api/v1/search/ {
            proxy_pass       http://host.docker.internal:8081;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 60s;
        }

        # Health check + static product images
        location /health {
            proxy_pass http://backend:8080;
        }

        location /static/ {
            proxy_pass http://backend:8080;
        }
    }
}
